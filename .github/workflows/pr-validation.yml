name: RKK proposal validation
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "docs/**"
      - ".github/workflows/pr-validation.yml"

permissions:
  contents: read

jobs:
  unit-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Verify compact results, winners and auto-sized widget
        run: node tests/test_widget_render.js
      - name: Verify live news headline dates and refresh/fallback
        run: node tests/test_news_live.js
      - name: Inline website JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('docs/widget.html','utf8');const a=h.match(/<script>([\s\S]*?)<\/script>/);if(!a)throw Error('Missing widget script');new Function(a[1]);new Function(fs.readFileSync('docs/news-embed.js','utf8'));console.log('Inline widget and news JS valid')"
