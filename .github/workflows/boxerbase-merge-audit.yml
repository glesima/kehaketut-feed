name: Validate BoxerBase merge candidate
on:
  push:
    branches: [fix/boxerbase-merged-club-20261104]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Apply reviewed candidate only on the isolated branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/boxerbase-merged-club-20261104
          cp docs/data.json "$RUNNER_TEMP/before.json"
          python qa/apply_boxerbase_migration.py
      - name: Unit and DOM regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts
          node tests/test_widget_render.js
          node tests/test_news_live.js
          node tests/test_club_identity.js
          node --check docs/profile-embed.js
          node --check docs/news-loader.js
          node --check docs/boxerbase-links.js
      - name: Fetch public canonical source and verify retained history
        run: |
          python scripts/update.py
          python qa/verify_boxerbase_migration.py "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/merge-verification.json"
          cat "$RUNNER_TEMP/merge-verification.json"
      - name: Refresh public registrations and recheck
        run: |
          pip install --quiet selenium==4.36.0
          python scripts/update_registrations_browser.py
          python qa/verify_boxerbase_migration.py "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/merge-verification.json"
          cat "$RUNNER_TEMP/merge-verification.json"
      - name: Preserve verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: boxerbase-merge-verification
          path: |
            ${{ runner.temp }}/merge-verification.json
            docs/data.json
            docs/rss.xml
          retention-days: 7
      - name: Commit validated candidate on the isolated branch only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/boxerbase-merged-club-20261104
          git rm qa/apply_boxerbase_migration.py .github/workflows/boxerbase-merge-audit.yml
          git add config.json scripts/update.py scripts/club_identity.py docs/widget.html docs/profile-embed.js docs/news-loader.js docs/boxerbase-links.js docs/BOXERBASE_MERGE_2026-11-04.md docs/data.json docs/rss.xml tests/test_update.py tests/test_club_identity.py tests/test_club_identity.js qa/verify_boxerbase_migration.py .github/workflows/pr-validation.yml CURRENT_STATUS.md CONTEXT_HANDOFF.md
          git diff --cached --check
          git config user.name rkk-site-bot
          git config user.email rkk-site-bot@users.noreply.github.com
          git commit -m 'Migrate to verified merged BoxerBase club and athlete profiles without losing history'
          git push origin HEAD:fix/boxerbase-merged-club-20261104
