name: RKK public website inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-audit.yml"
      - "scripts/site_audit.py"
      - "tests/test_site_audit.py"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rkk-weekly-public-site-audit
  cancel-in-progress: false

jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test audit safety
        run: python -m unittest tests/test_site_audit.py -v
      - name: Read-only public page inventory
        run: python scripts/site_audit.py --max-pages 90 --sleep 0.35
      - name: Commit audit report without touching page content
        run: |
          git config user.name "rkk-site-bot"
          git config user.email "rkk-site-bot@users.noreply.github.com"
          git add docs/site-audit.json docs/SIVUSTON_AUTOMAATTINEN_AUDITTI.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh bounded RKK public website audit [skip ci]"
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main
            else
              git rebase --abort || true
              echo "::warning::Concurrent change blocked audit report push; no force update."
            fi
          fi
