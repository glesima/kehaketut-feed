name: Keha-Ketut live feed and Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"
      - "tests/**"
      - "config.json"
      - "docs/**"
      - "embed/**"
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kehaketut-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Check parser
        run: python -m unittest discover -s tests -v
      - name: Refresh BoxerBase public data
        id: fetch
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/update.py
      - name: Preserve last known good data when fetch fails
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: echo "::warning::BoxerBase refresh failed or robots.txt prevented fetch. Publishing last known good data unchanged."
      - name: Refresh public Yhdistysavain news
        id: news
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Preserve news on public-source error
        if: ${{ steps.news.outcome == 'failure' }}
        run: echo "::warning::News feed refresh failed; keeping verified last-known-good news."
      - name: Search public BoxerBase registration lists in headless Chrome
        id: public_registrations
        continue-on-error: true
        run: |
          python -m pip install --quiet selenium==4.36.0
          python scripts/update_registrations_browser.py
      - name: Preserve existing data if public registration UI breaks
        if: ${{ steps.public_registrations.outcome == 'failure' }}
        run: echo "::warning::Public event registration UI failed; existing results and prior observations remain."
      - name: Commit successful refresh
        run: |
          git config user.name "rkk-site-bot"
          git config user.email "rkk-site-bot@users.noreply.github.com"
          git add docs/data.json docs/rss.xml docs/news.json docs/news-data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public RKK feed [skip ci]"
            # New site edits may land while this long-running feed fetch works.
            # Rebase fast-forward changes once and deploy even if the push races.
            git fetch origin main
            if git rebase origin/main; then
              if ! git push origin HEAD:main; then
                echo "::warning::Feed commit push raced with a newer change; deploying the fetched Pages snapshot anyway."
              fi
            else
              echo "::warning::Feed update rebase had conflicts; deploy snapshot without pushing over newer repository changes."
              git rebase --abort || true
            fi
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
