<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Kehä-Kettujen ajantasaiset tiedot</title>
<style>
:root{color-scheme:light;--red:#B91C2B;--ink:#171A1F;--bg:#f3f5f7;--line:#e1e5e9;--muted:#66727f}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:transparent;color:var(--ink);line-height:1.5}
main{max-width:1160px;margin:auto;padding:0 4px 10px}.ey{color:var(--red);letter-spacing:.12em;font-size:11px;font-weight:850;text-transform:uppercase}
h2{font-size:clamp(22px,3.5vw,30px);line-height:1.17;letter-spacing:-.025em;margin:6px 0 18px}
p{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.two{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}
.name{font-weight:820;font-size:14px;overflow-wrap:anywhere}.dim{font-size:12px;color:var(--muted)}
.link{color:#a7192b!important;font-weight:760;font-size:12px;text-decoration:none}.link:focus-visible,button:focus-visible{outline:3px solid #fb7185}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #e9edf0;padding:12px 0}
.row:first-of-type{border-top:0}.tag{font-size:11px;color:var(--red);font-weight:750;letter-spacing:.04em}
.pill{background:#f2f3f5;color:var(--ink);padding:5px 8px;border-radius:6px;font-size:11px;white-space:nowrap}
.muted{color:var(--muted);font-size:11px;margin-top:14px}.stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 15px}
.stats b{font-size:24px;display:block}.stats span{font-size:11px;color:var(--muted)}
.img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#f3f5f7}.igcaption{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45;max-height:3em}
.err{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.note{margin-top:8px}
@media(max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.card{padding:14px}.stats{gap:12px}}
</style></head><body><main id="rkk-root"><p>Haetaan Kehä-Kettujen tietoja…</p></main>
<script>
(function(){
'use strict';
const root=document.getElementById('rkk-root');
const params=new URLSearchParams(location.search);
const view=params.get('view')||'updates';
const boxerId=params.get('id')||'';
const mk=(tag,cls,txt)=>{let el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined&&txt!==null)el.textContent=String(txt);return el};
const append=(parent,...nodes)=>nodes.forEach(n=>parent.appendChild(n));
const link=(label,url)=>{let a=mk('a','link',label);if(url&&/^https:\/\//.test(url)){a.href=url;a.rel='noopener noreferrer';a.target='_blank'}else{a.href='#'}return a};
const fmt=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4):'Ajankohta avoin';
const head=(ey,title)=>{root.appendChild(mk('div','ey',ey));root.appendChild(mk('h2','',title))};
function updates(d){
 head('Kilpailut ja tulokset','Kehä-Ketut kehässä');
 let wrap=mk('div','grid two');let past=mk('div','card'),future=mk('div','card');
 append(past,mk('div','tag','VIIMEISIMMÄT TULOKSET'));
 let results=(d.matches||[]).filter(m=>m.result==='voitto'||m.result==='tappio').sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||'')).slice(0,4);
 if(!results.length)past.appendChild(mk('p','','Ei vahvistettuja tuloksia tiedossa.'));
 for(const m of results){let row=mk('div','row'),body=mk('div');append(body,mk('div','name',m.boxer+' – '+m.opponent),mk('div','dim',fmt(m.event_date)+' · '+m.event));append(row,body,link((m.result==='voitto'?'Voitto':'Tappio')+(m.decision?' '+m.decision:'' )+' ↗',m.url));past.appendChild(row)}
 append(future,mk('div','tag','SEURAAVAT VAHVISTETUT OTTELUT'));
 let today=(new Date()).toISOString().slice(0,10);
 let next=(d.matches||[]).filter(m=>m.result==='vahvistettu ottelu'&&(!m.event_date||m.event_date>=today)).sort((a,b)=>(a.event_date||'').localeCompare(b.event_date||'')).slice(0,4);
 if(!next.length){future.appendChild(mk('p','','Seuraavia vahvistettuja ottelupareja ei ole vielä löytynyt. Ilmoittautuminen ei yksin tarkoita vahvistettua ottelua.'));future.appendChild(link('Seuraa seuraa BoxerBasessa ↗','https://boxerbase.com/o/1Le8shnOwPIW/boxers'))}
 for(const m of next){let row=mk('div','row'),body=mk('div');append(body,mk('div','name',m.boxer+' – '+m.opponent),mk('div','dim',fmt(m.event_date)+' · '+m.event));append(row,body,link('Ottelulista ↗',m.url));future.appendChild(row)}
 if(next.length)future.appendChild(mk('p','dim','Ottelujen arvioidut alkamisajat muuttuvat. Tarkista ajantasainen ottelulista BoxerBasesta.'));
 let regs=(d.registrations||[]).filter(p=>p.status==='registered'&&p.event_date&&p.event_date>=today).sort((a,b)=>a.event_date.localeCompare(b.event_date));
 if(regs.length){
  future.appendChild(mk('div','tag','JULKISESTI ILMOITTAUTUNEET'));
  let groups=new Map();
  for(const p of regs){
    let key=p.event_id||p.event_url;
    if(!groups.has(key))groups.set(key,{event:p.event,date:p.event_date,url:p.event_url,names:[]});
    groups.get(key).names.push(p.boxer);
  }
  for(const event of [...groups.values()].slice(0,3)){
    let row=mk('div','row'),inner=mk('div');
    append(inner,mk('div','name',event.event),mk('div','dim',fmt(event.date)+' · Ilmoittautuneet: '+event.names.join(', ')));
    append(row,inner,link('Osallistujalista ↗',event.url+'/participants'));future.appendChild(row);
  }
  future.appendChild(mk('p','dim','Ilmoittautuminen ei takaa ottelua. Julkinen lista voi olla osittainen, joten puuttuva nimi ei todista ilmoittautumisen puuttumista.'));
 }
 append(wrap,past,future);root.appendChild(wrap)
}
function boxers(d){
 head('Nyrkkeilijät','Seuran ottelijat');root.appendChild(mk('p','','Ottelutilastot päivittyvät automaattisesti. Näkyvät luvut kattavat lähteeseen kirjatut ottelut eivätkä välttämättä koko otteluhistoriaa.'));
 let grid=mk('div','grid');
 for(const b of d.boxers||[]){let card=mk('div','card');append(card,mk('div','name',b.name),mk('p','',b.matches==null?'Ottelumäärä ei saatavilla':b.matches+(b.matches===1?' kirjattu ottelu':' kirjattua ottelua')));
 if(Number.isInteger(b.wins)&&Number.isInteger(b.losses))card.appendChild(mk('div','dim',b.wins+' voittoa · '+b.losses+' tappiota'));
 card.appendChild(link('Lähdeprofiili ↗',b.stats_source_url||b.boxerbase_url));
 grid.appendChild(card)}root.appendChild(grid);
}
function profile(d){
 let b=(d.boxers||[]).find(x=>x.id===boxerId);
 if(!b){root.appendChild(mk('div','err','Ottelijaa ei löydy tietosyötteestä.'));return}
 head('Ottelutilastot',b.name);let card=mk('div','card'),stats=mk('div','stats');
 const stat=(val,label)=>{let el=mk('div');append(el,mk('b','',val===null||val===undefined?'–':val),mk('span','',label));return el};
 append(stats,stat(b.matches,'Ottelua'),stat(b.wins,'Voittoa'),stat(b.losses,'Tappiota'));
 append(card,stats,link('Avaa lähdeprofiili ↗',b.stats_source_url||b.boxerbase_url));
 if(b.stats_source_note){card.appendChild(mk('p','dim','Tiedot väliaikaisesti rinnakkaisesta BoxerBase-profiilista, kunnes seuratiedot yhdistetään.'));}
 let recent=(d.matches||[]).filter(m=>m.boxer===b.name).slice(0,4);
 for(let m of recent){let r=mk('div','row');append(r,mk('div','dim',fmt(m.event_date)+' · '+m.opponent+' · '+m.result),link('Ottelu ↗',m.url));card.appendChild(r)}root.appendChild(card);
}
function instagram(d){
 head('Kuvia ja kuulumisia','Instagram · @kehaketut');
 let grid=mk('div','grid'),items=(d.instagram||[]).slice(0,6);
 if(!items.length){let note=mk('div','card');append(note,mk('p','','Kuvavirran automaattinen yhteys odottaa seuran Instagram API -valtuutusta.'),link('Seuraa @kehaketut ↗','https://www.instagram.com/kehaketut/'));root.appendChild(note);return}
 for(let item of items){let a=link('',item.url);a.className='card';a.style.display='block';if(item.image&&/^https:\/\//.test(item.image)){let img=mk('img','img');img.src=item.image;img.loading='lazy';img.alt=(item.caption||'Kehä-Ketut Instagram-kuva').slice(0,100);a.appendChild(img)}append(a,mk('p','igcaption',item.caption||'Instagram-julkaisu'),mk('div','dim',fmt(item.date)));grid.appendChild(a)}root.appendChild(grid)
}
function render(d,offline){root.textContent='';
 if(view==='boxers')boxers(d);else if(view==='profile')profile(d);else if(view==='instagram')instagram(d);else updates(d);
 let note=mk('div','muted note',(offline?'Esikatselu / varatieto · ':'')+'Tietolähde: BoxerBase'+(view==='instagram'?' ja Instagram':'')+' · Lähteen tarkistus: '+((view==='instagram'?d.instagram_checked_at:(view==='boxers'||view==='profile'?d.boxers_checked_at:d.matches_checked_at))||'ei vielä tarkistettu').slice(0,10));root.appendChild(note);report();
}
function report(){let height=Math.ceil(document.body.scrollHeight)+15;parent.postMessage({type:'RKK_WIDGET_HEIGHT',view,height},'*')}
new ResizeObserver(report).observe(document.body);
fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Feed unavailable');return r.json()}).then(d=>render(d,false)).catch(()=>{root.textContent='';append(root,mk('div','err','Tietosyötettä ei voi nyt ladata.'),link('Kehä-Ketut BoxerBasessa ↗','https://boxerbase.com/o/1Le8shnOwPIW/boxers'));report()});
})();
</script></body></html>
