<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kehä-Ketut Facebookissa</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;font:14px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#171a1f;background:transparent}
.wrap{max-width:1160px;margin:auto;padding:0 5px 8px}
.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.ey{display:block;font-size:11px;font-weight:850;letter-spacing:.14em;color:#a7192b;text-transform:uppercase}
h2{font-size:clamp(23px,3vw,30px);margin:4px 0 0;font-weight:850;line-height:1.1;letter-spacing:-.035em}
a{color:#a7192b!important;text-decoration:none;font-weight:750}
.more{border:1px solid #edcbd0;border-radius:8px;padding:10px 13px;background:#fff;font-size:12px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{border:1px solid #e1e5e9;border-radius:14px;background:#fff;padding:18px;display:flex;flex-direction:column;min-height:150px}
.date{font-size:11px;color:#737d87;margin-bottom:10px}
.body{font-size:14px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 14px}
.card a{font-size:12px;display:inline-block}
.status{font-size:11px;color:#75808a;margin:12px 0 0}
@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:start}.card{min-height:110px}.body{-webkit-line-clamp:3}}
body.embed .top{display:none}
body.embed .wrap{padding:0}
body.embed .grid{grid-template-columns:1fr}
body.embed .card{min-height:0;padding:13px 14px}
body.embed .body{font-size:13px;-webkit-line-clamp:3}
body.embed .status{font-size:10px}
</style></head><body><main class="wrap">
<div class="top"><div><span class="ey">Seuran kuulumiset</span><h2>Facebook</h2></div><a class="more" href="https://www.facebook.com/160875127258478/" target="_blank" rel="noopener noreferrer">Seuraa sivua ↗</a></div>
<div id="posts" class="grid" aria-live="polite"><div class="card">Haetaan seuran julkaisuja…</div></div>
<div class="status" id="status">Julkiset julkaisut • Riihimäen Kehä-Ketut</div>
</main>
<script>
(function(){
"use strict";
if(new URLSearchParams(location.search).get("embed")==="1")
  document.body.classList.add("embed");
const grid=document.getElementById("posts"),status=document.getElementById("status");
const r=(tag,cls,value)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(value!=null)el.textContent=value;return el};
const report=()=>{if(window.parent!==window)window.parent.postMessage({type:"RKK_WIDGET_HEIGHT",view:"facebook",height:Math.ceil(document.documentElement.scrollHeight)+15},"*")};
new ResizeObserver(report).observe(document.body);
function fallback(){grid.replaceChildren();const el=r("div","card","Julkaisut eivät juuri nyt lataudu.");const a=r("a","","Avaa Kehä-Kettujen Facebook-sivu ↗");a.href="https://www.facebook.com/160875127258478/";a.target="_blank";a.rel="noopener noreferrer";el.appendChild(a);grid.appendChild(el);report()}
fetch("./facebook.json",{cache:"no-store"}).then(x=>{if(!x.ok)throw Error("Facebook feed unavailable");return x.json()}).then(d=>{
 if(d.facebook_page_id!=="160875127258478"||d.brand_id!==7632678||!Array.isArray(d.posts))throw Error("Wrong Facebook brand");
 grid.replaceChildren();
 let count=0;
 for(const p of d.posts){
  if(count>=3)break;
  try{const u=new URL(p.url);if(u.protocol!=="https:"||u.hostname!=="facebook.com")continue}catch(e){continue}
  if(!p.text)continue;
  const card=r("article","card"),date=r("div","date",p.date.split("-").reverse().join(".")),body=r("p","body",p.text);
  const a=r("a","","Lue Facebookissa ↗");a.href=p.url;a.target="_blank";a.rel="noopener noreferrer";
  card.append(date,body,a);grid.appendChild(card);count++;
 }
 if(!count){fallback();return}
 status.textContent="Lähde: Kehä-Kettujen Facebook • viimeisin synkronointi "+(d.synced_at||"ei tiedossa");
 report();
}).catch(fallback);
})();
</script></body></html>
