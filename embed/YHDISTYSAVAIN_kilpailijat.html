<!-- Kehä-Ketut: ottelijakortit. Päivittyvä korkeus (desktop/tablet/mobile). -->
<style>
#rkk-auto-boxers{display:block;width:100%;height:520px;border:0;background:transparent}
@media(max-width:850px){#rkk-auto-boxers{height:800px}}
@media(max-width:540px){#rkk-auto-boxers{height:1420px}}
</style>
<iframe id="rkk-auto-boxers" title="Kehä-Kettujen ottelijat"
  loading="lazy"
  src="https://glesima.github.io/kehaketut-feed/widget.html?view=boxers"></iframe>
<script>
(function(){
 var frame=document.getElementById("rkk-auto-boxers");
 if(!frame)return;
 window.addEventListener("message",function(e){
  if(e.origin!=="https://glesima.github.io"||e.source!==frame.contentWindow||
     !e.data||e.data.type!=="RKK_WIDGET_HEIGHT"||e.data.view!=="boxers")return;
  var h=Number(e.data.height);
  if(Number.isFinite(h)&&h>180&&h<5000)frame.style.height=Math.ceil(h)+"px";
 });
})();
</script>
