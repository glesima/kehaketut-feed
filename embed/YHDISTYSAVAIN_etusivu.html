<!-- Replace USERNAME and REPOSITORY with real GitHub Pages address. -->
<iframe id="rkk-auto-updates" title="Kehä-Kettujen kilpailut ja tulokset" loading="lazy"
  src="https://glesima.github.io/kehaketut-feed/widget.html?view=updates"
  style="display:block;width:100%;height:500px;border:0;background:transparent"></iframe>
<script>
window.addEventListener('message', function(event) {
  if (event.origin !== 'https://glesima.github.io') return;
  if (!event.data || event.data.type !== 'RKK_WIDGET_HEIGHT' || event.data.view !== 'updates') return;
  var frame = document.getElementById('rkk-auto-updates');
  if (frame) frame.style.height = Math.max(260,Math.min(2000,Number(event.data.height)||500))+'px';
});
</script>
