<!-- Kehä-Ketut: kilpailutulokset, vahvistetut ottelut ja ilmoittautuneet. -->
<style>
#rkk-auto-updates{display:block;width:100%;height:480px;border:0;background:transparent}
@media(max-width:800px){#rkk-auto-updates{height:850px}}
@media(max-width:480px){#rkk-auto-updates{height:960px}}
</style>
<iframe id="rkk-auto-updates" title="Kehä-Kettujen kilpailut ja tulokset"
  loading="lazy"
  src="https://glesima.github.io/kehaketut-feed/widget.html?view=updates"></iframe>
<script>
(function(){
 var frame=document.getElementById("rkk-auto-updates");
 if(!frame)return;
 window.addEventListener("message",function(e){
  if(e.origin!=="https://glesima.github.io"||e.source!==frame.contentWindow||
     !e.data||e.data.type!=="RKK_WIDGET_HEIGHT"||e.data.view!=="updates")return;
  var h=Number(e.data.height);
  if(Number.isFinite(h)&&h>180&&h<5000)frame.style.height=Math.ceil(h)+"px";
 });
})();
</script>
