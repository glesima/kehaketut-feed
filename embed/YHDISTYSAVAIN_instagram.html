<iframe id="rkk-auto-ig" title="Kehä-Kettujen Instagram-kuvat" loading="lazy"
  src="https://glesima.github.io/kehaketut-feed/widget.html?view=instagram"
  style="display:block;width:100%;height:400px;border:0;background:transparent"></iframe>
<script>window.addEventListener('message',function(e){if(e.origin!=='https://glesima.github.io'||!e.data||e.data.type!=='RKK_WIDGET_HEIGHT'||e.data.view!=='instagram')return;var x=document.getElementById('rkk-auto-ig');if(x)x.style.height=Math.max(200,Math.min(1800,Number(e.data.height)||400))+'px'});</script>
