<!-- RKK News v1.0 | Kehaketut.fi custom front page, live source: /uutiset/ -->
<section id="rkk-news-live" aria-labelledby="rkk-news-title">
<style>
#rkk-news-live{--rk-red:#b91c2b;--rk-black:#171a1f;--rk-gray:#6d7780;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;max-width:1160px;margin:26px auto 32px;color:var(--rk-black)}
#rkk-news-live *{box-sizing:border-box}
#rkk-news-live .nh{display:flex;gap:14px;align-items:center;margin-bottom:15px}
#rkk-news-live .stripe{height:48px;width:5px;border-radius:8px;background:var(--rk-red);flex:none}
#rkk-news-live .eyebrow{display:block;color:#a7192b;font-size:10px;font-weight:850;letter-spacing:.15em;text-transform:uppercase}
#rkk-news-live h2{font-size:clamp(25px,3.2vw,32px)!important;line-height:1.16;margin:2px 0!important;color:var(--rk-black)!important;font-weight:850;letter-spacing:-.025em}
#rkk-news-live .all{margin-left:auto;flex:none;color:#a7192b!important;font-size:12px;font-weight:800;text-decoration:none;padding:10px 12px;border:1px solid #edcbd0;border-radius:9px;background:#fff}
#rkk-news-live .all:hover{background:#fff3f4}
#rkk-news-live .cards{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,1fr);grid-template-rows:repeat(2,minmax(136px,auto));gap:12px}
#rkk-news-live .item{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border:1px solid #e3e6e9;background:#fff;border-radius:14px;padding:20px 22px;text-decoration:none!important;color:var(--rk-black)!important;transition:border-color .16s,transform .16s,box-shadow .16s}
#rkk-news-live .item:hover,#rkk-news-live .item:focus-visible{border-color:#b91c2b;transform:translateY(-2px);box-shadow:0 6px 22px rgba(18,24,31,.08)}
#rkk-news-live .item:focus-visible{outline:3px solid #b91c2b;outline-offset:2px}
#rkk-news-live .item.lead{grid-row:span 2;min-height:286px;padding:25px 26px;background:linear-gradient(145deg,#fff,#faf8f8)}
#rkk-news-live .meta{display:flex;gap:9px;align-items:center;margin-bottom:10px;font-size:10px;font-weight:850;letter-spacing:.08em;color:#a7192b;text-transform:uppercase}
#rkk-news-live .tag{display:inline-flex;padding:5px 8px;background:#fff0f2;border-radius:6px}
#rkk-news-live .date{color:#747d86;font-weight:650;letter-spacing:0;font-size:11px}
#rkk-news-live h3{margin:0 0 10px!important;color:#1d242b!important;font-size:clamp(16px,1.7vw,20px)!important;line-height:1.28!important;letter-spacing:-.016em;font-weight:800;overflow-wrap:anywhere}
#rkk-news-live .lead h3{font-size:clamp(23px,2.45vw,30px)!important;max-width:28ch}
#rkk-news-live .excerpt{color:#58636d;font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 10px}
#rkk-news-live .lead .excerpt{-webkit-line-clamp:4;font-size:14px}
#rkk-news-live .read{font-size:11px;font-weight:850;color:#a7192b;align-self:flex-start;margin-top:12px}
#rkk-news-live .item .num{position:absolute;right:19px;bottom:18px;color:#e7eaed;font-size:38px;font-weight:900;line-height:1;letter-spacing:-.08em;pointer-events:none}
#rkk-news-live .item.lead .num{font-size:78px;color:#f1e1e3}
#rkk-news-live .note{color:#79838d;font-size:11px;margin:12px 0 0}
#rkk-news-live .state{padding:22px;background:#fff;border:1px solid #e3e6e9;border-radius:14px;color:#67737e;font-size:13px}
#rkk-news-live .state a{color:#a7192b!important;font-weight:800}
@media(max-width:730px){#rkk-news-live .cards{grid-template-columns:1fr;grid-template-rows:auto}#rkk-news-live .item.lead{grid-row:auto;min-height:218px;padding:20px}#rkk-news-live .item{padding:17px;min-height:135px}#rkk-news-live .all{font-size:11px;padding:9px}#rkk-news-live .lead h3{font-size:24px!important}}
@media(prefers-reduced-motion:reduce){#rkk-news-live .item{transition:none}#rkk-news-live .item:hover{transform:none}}
</style>
<div class="nh">
  <span class="stripe" aria-hidden="true"></span>
  <div><span class="eyebrow">Seuran kuulumiset</span><h2 id="rkk-news-title">Ajankohtaista</h2></div>
  <a class="all" href="/uutiset/">Kaikki uutiset ↗</a>
</div>
<div id="rkk-news-cards" class="cards" aria-live="polite">
  <div class="state" style="grid-column:1/-1">Haetaan uusimmat seurauutiset…</div>
</div>
<p class="note">Uutiset avautuvat alkuperäisille artikkeleille. Etusivu näyttää kolme uusinta julkista uutista.</p>
<script>
(function(){
  'use strict';
  var wrap=document.getElementById('rkk-news-cards');
  if(!wrap)return;
  var root='/uutiset/';
  var pfx='/uutiset/';
  function clean(s){return (s||'').replace(/\s+/g,' ').replace(/^[\s›»•]+|[\s›»•]+$/g,'').trim();}
  function validNews(href){
    try{
      var u=new URL(href,location.href);
      return (u.hostname==='kehaketut.fi'||u.hostname==='www.kehaketut.fi') &&
        u.pathname.startsWith(pfx) && u.pathname!==pfx &&
        u.pathname.slice(pfx.length).replace(/\/$/,'').length>2 ? u.href:null;
    }catch(e){return null;}
  }
  function getDate(txt,el){
    var t=el.querySelector('time[datetime]');
    if(t){var d=(t.getAttribute('datetime')||'').slice(0,10);if(/^20\d{2}-\d\d-\d\d$/.test(d))return d.split('-').reverse().join('.');}
    var m=txt.match(/\b(\d{1,2}\.\d{1,2}\.20\d{2})\b/g);
    return m?m[0]:'';
  }
  function parseNews(html){
    var dom=new DOMParser().parseFromString(html,'text/html');
    var seen=new Set(),out=[];
    Array.from(dom.querySelectorAll('a[href]')).forEach(function(a){
      var url=validNews(a.getAttribute('href'));
      if(!url||seen.has(url))return;
      var raw=clean(a.textContent);
      if(raw.length<9)return;
      var node=a.closest('article,li,[class*="news-item"],[class*="newsItem"]')||a;
      var date=getDate(raw,a)||getDate(clean(node.textContent),node);
      var cut=date?raw.indexOf(date):-1;
      var title=cut>4?clean(raw.slice(0,cut)):clean(raw.split(/ [\.!?] /)[0]);
      var excerpt=cut>0?clean(raw.slice(cut+date.length)):'';
      if(title.length>130){title=title.slice(0,127).replace(/\s+\S*$/,'')+'…';}
      if(!excerpt){
        var surrounding=clean(node.textContent);
        if(surrounding.length>raw.length&&surrounding.length<600)excerpt=clean(surrounding.slice(raw.length));
      }
      if(excerpt.length>220)excerpt=excerpt.slice(0,217).replace(/\s+\S*$/,'')+'…';
      if(!title||title.toLowerCase()==='uutiset')return;
      seen.add(url);out.push({url:url,title:title,date:date,excerpt:excerpt});
    });
    return out.slice(0,3);
  }
  function el(tag,cl,txt){var x=document.createElement(tag);if(cl)x.className=cl;if(txt)x.textContent=txt;return x;}
  function render(items){
    wrap.replaceChildren();
    items.forEach(function(n,i){
      var a=el('a','item'+(i===0?' lead':''));a.href=n.url;
      var head=el('div'),meta=el('div','meta');meta.appendChild(el('span','tag',i===0?'Uusin uutinen':'Seurauutiset'));
      if(n.date)meta.appendChild(el('span','date',n.date));head.appendChild(meta);
      head.appendChild(el('h3','',n.title));
      if(n.excerpt)head.appendChild(el('p','excerpt',n.excerpt));
      a.appendChild(head);a.appendChild(el('span','read','Lue uutinen ↗'));
      a.appendChild(el('span','num','0'+(i+1)));wrap.appendChild(a);
    });
  }
  function fail(){wrap.className='';wrap.replaceChildren();var p=el('div','state','Uutisia ei saatu ladattua tähän näkymään. ');var a=el('a','', 'Avaa seuran uutiset ↗');a.href=root;p.appendChild(a);wrap.appendChild(p);}
  fetch(root,{credentials:'same-origin',cache:'no-store'})
    .then(function(r){if(!r.ok)throw Error('Uutissivun lataus epäonnistui');return r.text();})
    .then(function(html){var items=parseNews(html);if(!items.length)throw Error('Uutisia ei löytynyt');render(items);})
    .catch(fail);
})();
</script>
</section>
