<!-- Kehä-Ketut: paikallinen Facebook-korttivirta GitHub Pagesista -->
<section id="rkk-facebook-feed" style="max-width:1160px;margin:26px auto;padding-top:24px;border-top:1px solid #d6dbe0">
<iframe id="rkk-facebook-iframe"
 title="Kehä-Kettujen Facebook-julkaisut"
 src="https://glesima.github.io/kehaketut-feed/facebook.html"
 loading="lazy" scrolling="no"
 style="display:block;width:100%;height:350px;border:0;background:transparent"
 ></iframe>
<script>
(function(){
var f=document.getElementById("rkk-facebook-iframe");
window.addEventListener("message",function(e){
if(!f||e.origin!=="https://glesima.github.io"||e.source!==f.contentWindow)return;
if(!e.data||e.data.type!=="RKK_WIDGET_HEIGHT"||e.data.view!=="facebook")return;
var height=Number(e.data.height);
if(height>100&&height<2500)f.style.height=Math.ceil(height+10)+"px";
});
})();
</script>
</section>
